<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlow — New ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div>
            <div class="brand-mark">TicketFlow <span class="brand-role-badge" id="brandRoleBadge"></span></div>
            <nav>
                <a href="tickets.html">Tickets</a>
                <a href="new-ticket.html" class="active">New ticket</a>
            </nav>
        </div>
        <div class="user-chip">
            <div id="userEmail" style="font-size:0.85rem; font-weight:600;"></div>
            <span class="role-badge" id="userRole"></span>
            <button id="logoutBtn" class="btn btn-ghost" style="width:100%; margin-top:12px;">Log out</button>
        </div>
    </aside>
    <main class="main" style="max-width:520px;">
        <div class="page-header"><h2>New ticket</h2></div>
        <div id="errorMsg" class="error-banner hidden"></div>
        <form id="ticketForm">
            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" required>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" rows="4" required></textarea>
            </div>
            <div class="field">
                <label for="priority">Priority</label>
                <select id="priority">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HIGH">High</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
            <div style="display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary" style="width:auto;">Create ticket</button>
                <a href="tickets.html" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/new-ticket.js"></script>
<a href="admin.html" id="adminNavLink">Approve agents</a>
</body>
</html>
