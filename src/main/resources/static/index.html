<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketFlow — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-role="CUSTOMER">
<div class="auth-shell">
    <div class="auth-side">
        <div class="brand-mark">TicketFlow</div>
        <div>
            <h1 id="sideHeadline">Support, tracked properly.</h1>
            <p id="sideCopy">Raise issues and follow them through to resolution.</p>
        </div>
        <div class="mono" style="font-size:0.75rem; opacity:0.6;">v1.0 — internal build</div>
    </div>
    <div class="auth-form-panel">
        <form id="loginForm" class="auth-form" autocomplete="off">
            <h2>Welcome back</h2>
            <div class="role-tabs">
                <button type="button" class="role-tab active" data-role="CUSTOMER">Customer</button>
                <button type="button" class="role-tab" data-role="AGENT">Agent</button>
                <button type="button" class="role-tab" data-role="ADMIN">Admin</button>
            </div>
            <div id="errorMsg" class="error-banner hidden"></div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        <svg class="icon-eye hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
            <p class="subtext" style="margin-top:16px; text-align:center;">No account? <a href="register.html" class="link">Create one</a></p>
        </form>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
